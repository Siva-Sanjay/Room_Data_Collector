<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Room Coordinate Collector</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
    }
    h2 { margin-top: 0; color: #1a73e8; font-size: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #3c4043; }
    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #dadce0;
      font-size: 15px;
      outline: none;
    }
    input:focus, select:focus { border-color: #1a73e8; }
    
    .gps-box {
      background: #e8f0fe;
      border: 1px solid #aecbfa;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #174ea6;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .gps-info { flex: 1; }
    .refresh-btn {
      width: auto;
      padding: 6px 10px;
      font-size: 12px;
      background: #ffffff;
      color: #1a73e8;
      border: 1px solid #1a73e8;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .refresh-btn:active { background: #e8f0fe; }

    button.submit-btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
    }
    button.submit-btn:disabled { background-color: #bdc1c6; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 14px; text-align: center; font-weight: 500; }
  </style>
</head>
<body>

<div class="card">
  <h2>📍 Add Campus Room</h2>
  
  <form id="roomForm" onsubmit="handleSubmit(event)">
    <div class="form-group">
      <label for="building">Building Name</label>
      <select id="building" required>
        <option value="">-- Select Building --</option>
        <option value="CDPO(NTB)">CDPO(NTB)</option>
        <option value="Annexe Hostel (WH)">Annexe Hostel (WH)</option>
        <option value="Tagore Hostel (WH)">Tagore Hostel (WH)</option>
        <option value="Ramanujan Hostel (OH)">Ramanujan Hostel (OH)</option>
        <option value="Lake View Hostel">Lake View Hostel</option>
        <option value="New Hostel">New Hostel</option>
        <option value="New Acad Block (NAB)">New Acad Block (NAB)</option>
        <option value="Old Acad Block (OAB)">Old Acad Block (OAB)</option>
        <option value="Management Development Centre (MDC)">Management Development Centre (MDC)</option>
        <option value="AmphiTheatre">AmphiTheatre</option>
      </select>
    </div>

    <div class="form-group">
      <label for="floor">Floor Number</label>
      <select id="floor" required>
        <option value="">-- Select Floor --</option>
        <option value="0">0 (Ground Floor)</option>
        <option value="1">1st Floor</option>
        <option value="2">2nd Floor</option>
        <option value="3">3rd Floor</option>
        <option value="4">4th Floor</option>
        <option value="5">5th Floor</option>
        <option value="6">6th Floor</option>
      </select>
    </div>

    <div class="form-group">
      <label for="roomNumber">Room Number</label>
      <input type="text" id="roomNumber" placeholder="e.g. 101 or C-35" required>
    </div>

    <div class="form-group">
      <label for="roomName">Room Name (Optional)</label>
      <input type="text" id="roomName" placeholder="e.g. Room 101 or Physics Lab">
    </div>

    <div class="gps-box">
      <div class="gps-info" id="gpsStatus">📡 Ready to fetch GPS...</div>
      <button type="button" class="refresh-btn" onclick="fetchGPSLocation()">🔄 Refresh GPS</button>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Save to Google Sheet</button>
  </form>

  <div id="status"></div>
</div>

<script>
  const scriptUrl = 'https://script.google.com/macros/s/AKfycbyWa1KFB_GYx5eEfOU7MwgNIGjffYc8gAFItINk1czves7vJMT0tIXd5REntF02tiCPBw/exec';

  let currentLat = null;
  let currentLng = null;

  // Standalone manual refresh function
  function fetchGPSLocation() {
    return new Promise((resolve, reject) => {
      const statusBox = document.getElementById('gpsStatus');
      statusBox.innerHTML = '📡 Acquiring GPS Location...';
      
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          position => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
            statusBox.innerHTML = `✅ <b>GPS Lock Acquired:</b><br>Lat: ${currentLat.toFixed(6)}, Lng: ${currentLng.toFixed(6)}`;
            resolve(position);
          },
          error => {
            statusBox.innerHTML = `❌ <b>GPS Error:</b> ${error.message}.`;
            reject(error);
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        statusBox.innerText = "❌ Geolocation not supported.";
        reject(new Error("Geolocation not supported"));
      }
    });
  }

  window.onload = function() {
    // Warm up backend Script instance on page load
    fetch(scriptUrl, { mode: 'no-cors' }).catch(() => {});
  };

  function generateRoomId(building, roomNumber) {
    const cleanBuilding = building.replace(/[^a-zA-Z]/g, '').substring(0, 4);
    const cleanRoom = roomNumber.replace(/[^a-zA-Z0-9]/g, '');
    return `${cleanBuilding}_${cleanRoom}`;
  }

  async function handleSubmit(event) {
    event.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    // 1. Disable button immediately while fetching GPS
    submitBtn.disabled = true;
    submitBtn.innerText = "📡 Fetching GPS...";
    statusDiv.innerText = "";

    try {
      // 2. Fetch fresh GPS coordinates
      await fetchGPSLocation();

      // Read form inputs
      const building = document.getElementById('building').value;
      const floor = document.getElementById('floor').value;
      const roomNumber = document.getElementById('roomNumber').value.trim();
      let roomName = document.getElementById('roomName').value.trim();
      const roomId = generateRoomId(building, roomNumber);

      if (!roomName) {
        roomName = roomId;
      }

      const payload = {
        roomId: roomId,
        building: building,
        floor: floor,
        roomNumber: roomNumber,
        roomName: roomName,
        latitude: currentLat,
        longitude: currentLng
      };

      // 3. Immediately re-enable button and inform user
      submitBtn.disabled = false;
      submitBtn.innerText = "Save to Google Sheet";
      statusDiv.style.color = "#28a745";
      statusDiv.innerHTML = `✅ Saved! Added <b>${roomId}</b> in background.`;

      // 4. Send network request asynchronously in background without blocking UI
      fetch(scriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => {
        statusDiv.style.color = "#d93025";
        statusDiv.innerText = "❌ Background Sync Failed: " + err.message;
      });

    } catch (err) {
      statusDiv.style.color = "#d93025";
      statusDiv.innerText = "❌ Failed to fetch GPS location.";
      submitBtn.disabled = false;
      submitBtn.innerText = "Save to Google Sheet";
    }
  }
</script>

</body>
</html>
